name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: daemon (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/daemon/package-lock.json
      - run: npm ci
        working-directory: packages/daemon
      - run: npm test
        working-directory: packages/daemon

  renderer:
    name: renderer (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/renderer/package-lock.json
      - run: npm ci
        working-directory: packages/renderer
      - run: npm test
        working-directory: packages/renderer
      # `build` is tsc --noEmit && vite build, so this is the typecheck too
      - run: npm run build
        working-directory: packages/renderer

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: sourced files that only exist on a user's machine
          shellcheck --severity=warning --exclude=SC1091 scripts/*.sh
