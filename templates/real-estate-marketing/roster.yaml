# Template: Real Estate Marketing — công ty đa agent cho team marketing bất động sản.
# Apply bằng: `node scripts/company-template.mjs apply real-estate-marketing`
#
# Bản GENERAL: chưa gắn với khách cụ thể. Các chỗ trống (<TÊN ĐƠN VỊ>, <SẢN PHẨM>, ...)
# nằm trong goals.md — điền trước khi giao cho company-pm.
#
# Persona + SOP (lane L6): member dạng block có `persona:` và `sop:` (sops/<vị-trí>.md, tiếng Việt).
# `source: builtin` = vị trí không cần cài skill — persona + SOP chính là member (điều phối, kiểm tra pháp lý).
#
# Mọi member DƯỚI ĐÂY là skill/agent ĐÃ CÀI trên máy người tạo template. Khi apply, CLI báo
# skill nào thiếu trên máy đích → chạy `company-hire` (scan an toàn) trước khi dùng.
#
# Năng lực template CHƯA có → xem 2 mục trong goals.md, KHÔNG thêm vào file này cho tới khi cài:
#   - "Cần tuyển" — gap thật (đăng FB/TikTok/Zalo, chạy ads, định giá, pháp lý dự án).
#   - "Roster đề xuất — cần tuyển" — 22 skill còn lại của coreyhaines31/marketingskills (CHƯA cài).
#     10 skill của bộ này đã cài 2026-07-09 và đã nằm trong danh sách member bên dưới.
version: 1
updated: 2026-10-27
departments:
  marketing:
